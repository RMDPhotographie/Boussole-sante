<!DOCTYPE html>
<html lang="fr">
  <head>
      <meta charset = "UTF-8">
      <link rel="icon" type="image/png" href="Boussole sante favicon.png">
      <title>
          Boussole santé
      </title>
      <style>
          .body {
              background-color: #fbfae4;
              cursor: url("curseur.png"), auto;
              min-height: 100vh;
              margin: 0px;
           }
          a:link {
              text-decoration: none;
              color: white;
           }
          a:hover {
              cursor: url("curseur2.png") 8 2, pointer;
           }
          a:active {
              cursor: url("curseur2.png") 8 2, pointer;
           }
          a:visited {
              color: white;
           }
          p, h1, h2, h3, span, label {
              cursor: url('curseur3.png') 4 16, text !important;
           }
          ::selection {
              background: #f5a66e;
              color: #333333;
           }
          ::-moz-selection {
          background: #f5a66e;
          color: #333333;
           }
          #loader {
              z-index: 9999;
              background-color: #37858f;
              top: 0;
              left: 0;
              width: 100vw;
              height: 100vh;
              position: fixed;
              display: flex;
              justify-content: center;
              align-items: center;
              transition: opacity 1s ease-out;
           }
          #spinner {
              width: 40vw;
              height: auto;
           }
          .barreHaut {
              background-color: #14545e;
              position: fixed;
              top: 0;
              left: 0;
              z-index: 1000;
              width: 100vw;
              height: auto;
              padding: 0px;
           }
          .boutonHaut {
              animation: entrée 1s;
              display: inline-block;
              background-color: #37858f;
              color: white;
              padding: 10px 20px;
              text-decoration: none;
              border-radius: 20px;
              font-family: Arial, sans-serif;
              font-weight: bold;
              cursor: pointer;
              transition: padding 0.4s;
           }
          .boutonHaut:hover {
              padding: 10px 30px;
           }
          .table {
              border-collapse: separate;
           }
          .celluleCote {
              font-size: clamp(0.7rem, 2vw, 1rem);
              white-space: nowrap;
           }
          .celluleMilieu {
              padding: 5vh 5vw;
              border: none;
              font-size: clamp(0.7rem, 2vw, 1rem);
              white-space: nowrap;
           }
          .barreArrière {
              top: 0;
              left: 0;
              width: 100vw;
              height: auto;
              padding: 0px;
           }
          .blocTexte {
              background-image: url("Bloc texte.png");
              background-size: cover;
              background-position: center;
              background-attachment: fixed;
              width: 100%;
              box-sizing: border-box;
              padding: 30px 5px;
              color: white;
              font-family: Arial, sans-serif;
              font-size: 5vw;
              font-weight: bold;
              white-space: nowrap;
           }
          .boussoleO {
              height: 0.8em;
              width: auto;
              vertical-align: middle;
              margin: 0px 0.5px;
           }
          .blocBoutons {
              background-color: #37858f;
              background-size: cover;
              width: 100vw;
           }
          .blocBoutonsTexte {
              color: white;
              font-family: Arial, sans-serif;
              font-size: clamp(1rem, 2vw, 1.4rem);
              font-weight: bold;
              padding: 10px;
           }
          .photoBouton {
              width: 15vw;
              height: auto;
              border-radius: 60px;
              transition: border-radius 0.4s;
              padding: 10px 20px;
           }
          .photoBouton:hover {
              border-radius: 35px;
           }
          .barreBas {
              background-color: #14545e;
              background-size: cover;
              width: 100%;
              box-sizing: border-box;
              height: auto;
              padding: 10px 0px;
              font-family: Arial, sans-serif;
              font-weight: bold;
              color: white;
              font-size: clamp(0.7rem, 2vw, 1rem);
              white-space: nowrap;
           }
      </style>
  </head>
<body class = "body">
    <div id = "loader">
        <img src = "Boussole santé spinner.gif" id = "spinner" alt = "Spinner">
        <script>
            window.addEventListener("load", () => {
                setTimeout(() => {
                    document.getElementById("loader").style.opacity = "0";
                    setTimeout(() => { loader.style.display = "none"; }, 1000);
                }, 1200);
            });
        </script>
    </div>
    <div class = "barreHaut">
        <center>
            <table class = "table">
                <tr>
                    <td class = "celluleCote">
                        <a href = "Boussole santé - Alimentation.html" class = "boutonHaut">Alimentation</a>
                    </td>
                    <td class = "celluleMilieu">
                        <a href = "Boussole santé - Conditionnement.html" class = "boutonHaut">Conditionnement</a>
                    </td>
                    <td class = "celluleCote">
                        <a href = "Boussole santé - Consommation.html" class = "boutonHaut">Consommation</a>
                    </td>
                </tr>
            </table>
        </center>
    </div>
    <div class = "barreArrière">
        <center>
            <table class = "table">
                <tr>
                    <td class = "celluleCote">
                        <span class = "boutonHaut" style = "opacity: 0;">Alimentation</span>
                    </td>
                    <td class = "celluleMilieu">
                        <span class = "boutonHaut" style = "opacity: 0;">Conditionnement</span>
                    </td>
                    <td class = "celluleCote">
                        <span class = "boutonHaut" style = "opacity: 0;">Consommation</span>
                    </td>
                </tr>
            </table>
        </center>
    </div>
    <div class = "blocTexte">
        <center>
            <p>
                Trop d'infos sur la santé ?
            </p>
            <p>
                Ici, on t'aide à retrouver le n<img src = "Boussole o.png" class = "boussoleO" alt = "o">rd.
            </p>
        </center>
    </div>
    <div class = "blocBoutons">
        <center>
            <table style = "padding: 7px;">
                <tr>
                    <td>
                        <a href = "Boussole santé - Alimentation.html" class = "photoBouton"><img src = "Guide alimentaire canadien.png" class = "photoBouton"></a>
                    </td>
                    <td>
                        <a href = "Boussole santé - Conditionnement.html" class = "photoBouton"><img src = "Conditionnement.png" class = "photoBouton"></a>
                    </td>
                    <td>
                        <a href = "Boussole santé - Consommation.html" class = "photoBouton"><img src = "Vapotage.png" class = "photoBouton"></a>
                    </td>
                </tr>
                <tr>
                    <td>
                        <center>
                            <span class = "blocBoutonsTexte">
                                <a href = "Boussole santé - Alimentation.html">Alimentation</a>
                            </span>
                        </center>
                    </td>
                    <td>
                        <center>
                            <span class = "blocBoutonsTexte">
                                <a href = "Boussole santé - Conditionnement.html">Conditionnement</a>
                            </span>
                        </center>
                    </td>
                    <td>
                        <center>
                            <span class = "blocBoutonsTexte">
                                <a href = "Boussole santé - Consommation.html">Consommation</a>
                            </span>
                        </center>
                    </td>
                </tr>
            </table>
        </center>
    <div class = "barreBas">
        <center>
            <span>
                © 2026 Boussole santé. Tous droits réservés.
            </span>
        </center>
    </div>
</body>
</html>
